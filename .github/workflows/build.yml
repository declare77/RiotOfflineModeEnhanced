name: Build

# Every push and pull request is built on a clean GitHub-hosted Windows machine.
#
# Releases: when master reaches a <Version> (in Deceive/Deceive.csproj) that has no
# release yet, this workflow tags the commit as v<Version> and publishes a GitHub
# Release with the zip, its SHA-256 checksums and a build provenance attestation, so
# anyone can verify the download was built by this workflow from this repository's
# source. To publish a new version: bump <Version>, push to master. Pushing a tag
# like v1.2.3 by hand also works.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: RiotOfflineModeEnhanced

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # create the release
      id-token: write       # build provenance attestation
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to know whether this version was released

      - name: Decide whether to release
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Deceive/Deceive.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"; $release = $true
          } else {
            $tag = "v$version"
            $exists = git tag --list $tag
            $release = ("${{ github.event_name }}" -eq "push") -and ("${{ github.ref }}" -eq "refs/heads/master") -and (-not $exists)
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "DO_RELEASE=$($release.ToString().ToLower())" >> $env:GITHUB_ENV
          "Version $version, tag $tag, release: $release" >> $env:GITHUB_STEP_SUMMARY

      - name: Build
        run: dotnet build Deceive/Deceive.csproj -c Release -p:AppName=${{ env.APP_NAME }} -p:DebugType=None -p:DebugSymbols=false

      - name: Package
        shell: pwsh
        run: |
          $name = $env:APP_NAME
          $out = "Deceive/bin/Release/net472"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "$out/$name.exe", "$out/$name.exe.config" $dir
          Copy-Item LICENSE "$dir/LICENSE.txt"
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}"
          (Get-Content packaging/README.txt -Raw).Replace('{{REPO_URL}}', $repoUrl) | Set-Content "$dir/README.txt" -Encoding utf8
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip" -Force
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist/$name.zip.sha256" -Encoding ascii
          $exeHash = (Get-FileHash "$dir/$name.exe" -Algorithm SHA256).Hash.ToLower()
          "ZIP_SHA256=$hash" >> $env:GITHUB_ENV
          "EXE_SHA256=$exeHash" >> $env:GITHUB_ENV
          "### Build output`n`n| File | SHA-256 |`n|---|---|`n| $name.zip | ``$hash`` |`n| $name.exe | ``$exeHash`` |" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: |
            dist/${{ env.APP_NAME }}.zip
            dist/${{ env.APP_NAME }}.zip.sha256

      - name: Attest build provenance
        if: env.DO_RELEASE == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/${{ env.APP_NAME }}.zip
            dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}.exe

      - name: Publish release
        if: env.DO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: ${{ env.APP_NAME }} ${{ env.RELEASE_TAG }}
          files: |
            dist/${{ env.APP_NAME }}.zip
            dist/${{ env.APP_NAME }}.zip.sha256
          body: |
            Download **${{ env.APP_NAME }}.zip**, extract it, and run `${{ env.APP_NAME }}.exe`. See the README inside for details.

            This release was built automatically by GitHub Actions from commit ${{ github.sha }} of this repository (no manual uploads).

            | File | SHA-256 |
            |---|---|
            | ${{ env.APP_NAME }}.zip | `${{ env.ZIP_SHA256 }}` |
            | ${{ env.APP_NAME }}.exe | `${{ env.EXE_SHA256 }}` |

            Verify that a download came from this repository's build:
            ```
            gh attestation verify ${{ env.APP_NAME }}.zip --repo ${{ github.repository }}
            ```

            Windows may show "Windows protected your PC" because the app isn't code-signed. Click **More info** → **Run anyway**.
